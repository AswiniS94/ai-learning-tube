# Key concepts per topic and level. The "core path" for a level is the smallest set of
# good videos (or a course) that together cover every concept listed here, so learners
# get a short, complete path instead of a long list.
#
# A video covers a concept when one of the concept's keywords appears in its title,
# tags or description (after promo text is removed); a course covers the concepts of
# all its lectures. List concepts in the order they should be learned — the path
# follows that order. Matching uses the same normalization as taxonomy.toml
# ("fine-tuning" == "fine tuning").
#
# All 13 topics have a checklist. A topic without one falls back to the top-rated-per-level path.

