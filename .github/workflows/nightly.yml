name: Nightly build & deploy

on:
  schedule:
    - cron: "23 7 * * *"   # 07:23 UTC every day (about 2–3 AM US Eastern)
  workflow_dispatch:
    inputs:
      full_rescan:
        description: "Rescan every uploads list and playlist (uses more quota)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "config/**"
      - "builder/**"
      - "site/**"
      - ".github/workflows/nightly.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore YouTube cache
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: yt-state-${{ github.run_id }}
          restore-keys: yt-state-

      - name: Validate config
        run: python -m builder check

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Sync from YouTube and build site
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Built-in token, used read-only for GitHub repo details (stars, last update).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a free Semantic Scholar API key gives more reliable citation counts.
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_rescan }}" = "true" ]; then
            python -m builder build --full
          else
            python -m builder build
          fi

      - name: Save YouTube cache
        if: always() && hashFiles('.state/state.json.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: .state
          key: yt-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
