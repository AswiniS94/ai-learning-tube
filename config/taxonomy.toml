# Topic, level and format rules used to tag every video.
#
# Matching is done on lowercase text where every non-alphanumeric character
# becomes a space, so "fine-tuning", "Fine Tuning" and "fine_tuning" all match
# the keyword "fine tuning". Keywords match whole words only.
#
#   keywords    strong terms; one hit in a title is enough to tag the topic
#   contextual  ambiguous terms ("transformer", "agent", "diffusion"...). They
#               only count when the video also contains an AI context term, and
#               they count for half. A video also needs at least one strong hit
#               (or membership in a relevant course playlist) to be kept.
#
# Edit freely; the next build re-tags the whole catalog from cached metadata,
# so tuning this file costs no extra YouTube API quota.

[classifier]
title_weight = 3.0
tag_weight = 2.0
description_weight = 1.0
contextual_factor = 0.5
# Score a video needs on its best topic to be included.
threshold = 3.0
# Secondary topics need at least this fraction of the best topic's score.
secondary_ratio = 0.5
max_topics = 3
# A course playlist passes this fraction of its topic score to every video in it.
playlist_inherit_factor = 0.75

# Presence of any of these anywhere in a video's text enables "contextual" terms.
ai_context = [
  "artificial intelligence", "machine learning", "deep learning", "neural network",
  "neural networks", "ai", "ml", "llm", "llms", "large language model",
  "large language models", "language model", "language models", "generative ai",
  "genai", "gen ai", "data science", "computer vision", "nlp",
  "natural language processing", "reinforcement learning", "chatgpt", "gpt",
  "foundation model", "foundation models", "agentic", "ai agent", "ai agents",
]

# Any of these in a title removes the video (promotional / admin content).
exclude_title = [
  "how to enroll", "enrollment", "info session", "information session",
  "admission", "admissions", "graduate certificate", "certificate program",
  "program overview", "student spotlight", "meet the instructor", "trailer",
  "teaser", "commencement", "alumni", "career fair", "top questions",
  "power transformer", "distribution transformer", "transformer winding",
  "current transformer", "potential transformer", "single phase transformer",
  "three phase transformer", "transformer protection",
]

# Title or playlist-title matches that mark news shows and podcasts. They stay
# searchable but are kept out of the learning paths.
news_patterns = [
  "podcast", "episode", "tech now", "news", "this week in", "weekly roundup",
  "mixture of experts podcast", "ai in action",
]

