# Curated, publicly available resources. Links only — nothing is re-hosted.
# Every link here was checked when it was added, and the nightly build re-checks
# them (dead links are hidden automatically after two failed checks).
#
# kind: code | notebook | notes | course | paper
#
# [[course]] attaches links to a course/playlist on the site.
#   codes     course numbers found in the playlist title (e.g. "cs229", "6.s191")
#   playlists YouTube playlist IDs (alternative to codes)
#
# [[starter]] is the "Starter kit" shown at the top of a topic's learning path.
# Keep each kit short (3–6 links) — the point is to avoid overwhelming people.

