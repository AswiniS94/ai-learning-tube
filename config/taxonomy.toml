# -------------------------------------------------------------- ranking ----
# Quality score (0–100) = weighted sum of these components × channel weight.
# Audience signals are compared within each channel so a small, excellent
# channel isn't buried by a huge one.
#   approval     likes per view, smoothed so low-view videos sit near average
#   popularity   total views and views per day (within channel)
#   engagement   comments per view, smoothed
#   freshness    decays with age using the topic's half_life_years
#   completeness has captions, chapters, a real description
#   structure    part of a full course playlist
[ranking]
approval = 0.30
popularity = 0.25
engagement = 0.10
freshness = 0.15
completeness = 0.10
structure = 0.10
